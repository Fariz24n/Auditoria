name: auditoria_ai
description: Flutter app with PDF reader and AI theme analyzer
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  syncfusion_flutter_pdf: 31.1.23
  syncfusion_flutter_pdfviewer: 31.1.23
  reorderables: ^0.6.0
  go_router: ^16.3.0
  google_generative_ai: ^0.4.3
  flutter_dotenv: ^5.0.2
  audioplayers: ^6.1.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^10.3.3
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env